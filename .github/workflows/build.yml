name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: admin-ui/pnpm-lock.yaml

      # 产物写入 server/wwwroot/admin（emptyOutDir 会清掉仓库里已提交的旧哈希文件），
      # 必须在 dotnet publish 之前执行才会被打进发布包
      - name: Build admin-ui
        working-directory: admin-ui
        run: pnpm install --frozen-lockfile && pnpm run build

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish server
        run: dotnet publish server/server.csproj -c Release -o "$RUNNER_TEMP/publish" --nologo

      - name: Pack bundle
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="$GITHUB_REF_NAME"
          else
            VERSION="${GITHUB_SHA::7}"
          fi
          ZIP="snap-hutao-server-$VERSION.zip"

          # 本地 publish 照常带出配置与私钥；CI 产物里排除，避免密钥进入可下载的
          # artifact/Release，也避免部署时覆盖服务器上已有的配置
          bundle="$RUNNER_TEMP/bundle"
          cp -a "$RUNNER_TEMP/publish" "$bundle"
          find "$bundle" -maxdepth 1 \( -name 'appsettings*.json' -o -name 'privkey.key' \) -print -delete

          (cd "$bundle" && zip -qr "$RUNNER_TEMP/$ZIP" .)
          echo "bundle=$RUNNER_TEMP/$ZIP" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: bundle
          path: ${{ env.bundle }}
          if-no-files-found: error

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bundle

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          zip=(snap-hutao-server-*.zip)
          sha256sum "${zip[0]}" > "${zip[0]}.sha256"
          gh release create "$GITHUB_REF_NAME" "${zip[0]}" "${zip[0]}.sha256" \
            --title "$GITHUB_REF_NAME" --generate-notes
