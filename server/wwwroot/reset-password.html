<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>Snap Hutao Rev</title>
    <style>
        :root {
            color-scheme: light dark;
            --bg: #f5f6f7;
            --card: #ffffff;
            --border: #dadce0;
            --text: #202124;
            --text-2: #5f6368;
            --accent: #3a9aed;
            --danger: #fd6243;
            --ok: #2bb16c;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1b1c1e;
                --card: #26272a;
                --border: #3a3c40;
                --text: #e8eaed;
                --text-2: #9aa0a6;
            }
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            background: var(--bg);
            color: var(--text);
            font-family: "Segoe UI", "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif;
            font-size: 14px;
            line-height: 1.6;
        }

        main {
            width: 100%;
            max-width: 420px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 32px 28px;
        }

        h1 {
            margin: 0 0 4px;
            font-size: 20px;
            font-weight: 600;
        }

        .brand {
            color: var(--accent);
            font-weight: 700;
            letter-spacing: .5px;
        }

        p { margin: 0 0 16px; }

        .hint { color: var(--text-2); font-size: 13px; }

        .account {
            font-family: Consolas, Monaco, monospace;
            letter-spacing: .5px;
        }

        .expire {
            display: inline-block;
            margin-bottom: 20px;
            padding: 6px 10px;
            border-radius: 4px;
            background: rgba(58, 154, 237, .1);
            color: var(--accent);
            font-variant-numeric: tabular-nums;
        }

        label { display: block; margin-bottom: 6px; color: var(--text-2); }

        input {
            width: 100%;
            margin-bottom: 16px;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 4px;
            background: transparent;
            color: var(--text);
            font-size: 14px;
        }

        input:focus { outline: none; border-color: var(--accent); }
        input:disabled { opacity: .6; }

        button {
            width: 100%;
            padding: 10px 12px;
            border: 0;
            border-radius: 4px;
            background: var(--accent);
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        button:disabled { opacity: .5; cursor: not-allowed; }

        .error {
            margin-bottom: 16px;
            padding: 10px 12px;
            border-radius: 4px;
            background: rgba(253, 98, 67, .1);
            color: var(--danger);
        }

        .done { text-align: center; }

        .done .mark { color: var(--ok); font-size: 40px; line-height: 1; }

        [hidden] { display: none !important; }

        footer {
            margin-top: 20px;
            color: var(--text-2);
            font-size: 11px;
            text-align: center;
        }
    </style>
</head>
<body>
<main>
    <p class="brand">Snap Hutao Rev</p>
    <h1 id="title"></h1>
    <p id="lead" class="hint"></p>

    <div id="loading" class="hint"></div>

    <div id="error" class="error" hidden></div>

    <form id="form" hidden autocomplete="off">
        <p class="account" id="account"></p>
        <span class="expire" id="expire"></span>

        <label for="password" id="label-password"></label>
        <input type="password" id="password" name="password" autocomplete="new-password" required>

        <label for="confirm" id="label-confirm"></label>
        <input type="password" id="confirm" name="confirm" autocomplete="new-password" required>

        <button type="submit" id="submit"></button>
    </form>

    <div id="done" class="done" hidden>
        <p class="mark">&#10003;</p>
        <p id="done-text"></p>
    </div>

    <footer id="footer"></footer>
</main>

<script>
    // 与启动器内置的公钥一致：字段值为 RSA-2048 OAEP-SHA1 加密后的 base64
    const PUBLIC_KEY_SPKI = "MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA0Uv7IhpG+gBdwz8PFs0JGxblkYV+KIc8Yv1iNpXmT8mxLfNIStsn3ypSWlsdfikVU1CoPNGQUQWy6RAq1/SDOtHxUR1b/2E4HgPiGSwQRNnvdmi9FcgQx0pc6baNuHaF1HDSQRPh4a/LrJ2qGnMws0CZFNsFvXD0FbmJHfxJTZc+V+CZW28OLLeD576HuJO2LI6pHWj7yFjTxYKj2jfYq9PdjsJmOtMZwmazYhrWuiuoXriFmAMQ+MxcqRAUZGHbkMh3qUJJJi6baB99/xFKaStB7P/8FFy8P1zbKGNanZtZER6Ji7YmIikllS6hi4WUcXu0314ZDFu4K2ephJzudwIDAQAB";
    const API = "/api/passport/v2/password/reset";

    const I18N = {
        zh: {
            title: "重置密码",
            lead: "你正在通过邮件里的链接设置新的 Snap Hutao Rev 通行证密码。",
            loading: "正在校验链接…",
            account: "账号",
            expire: "剩余有效时间",
            password: "新密码",
            confirm: "确认新密码",
            submit: "重置密码",
            done: "密码已更新，可以用新密码登录了。",
            footer: "链接一次有效，用完即失效；如未发起该请求请忽略。",
            noToken: "链接缺少令牌，请重新从邮件中打开。",
            invalid: "链接已失效或已被使用，请重新发起重置。",
            expired: "链接已过期，请重新发起重置。",
            tooShort: "密码至少 8 位。",
            mismatch: "两次输入的密码不一致。",
            network: "网络异常，请稍后重试。",
            submitting: "提交中…",
            messages: {
                ServerPassportVerifyFailed: "链接已失效或已被使用，请重新发起重置。",
                ServerPassportVerifyTooFrequent: "请求过于频繁，请 1 分钟后再试。",
                ServerPassportPasswordTooShort: "密码至少 8 位。",
                ServerPassportResetPasswordTheSamePassword: "新密码不能与当前密码相同。",
                ServerPassportServiceEmailHasNotRegistered: "该邮箱对应的账号已不存在。",
            },
        },
        en: {
            title: "Reset password",
            lead: "You are setting a new Snap Hutao Rev passport password from the link in your email.",
            loading: "Checking the link…",
            account: "Account",
            expire: "Expires in",
            password: "New password",
            confirm: "Confirm new password",
            submit: "Reset password",
            done: "Password updated, you can sign in with the new one.",
            footer: "This link works once; ignore it if you did not request a reset.",
            noToken: "This link has no token, please open it from the email again.",
            invalid: "This link is invalid or already used, please request a new one.",
            expired: "This link has expired, please request a new one.",
            tooShort: "Password must be at least 8 characters.",
            mismatch: "The two passwords do not match.",
            network: "Network error, please try again later.",
            submitting: "Submitting…",
            messages: {
                ServerPassportVerifyFailed: "This link is invalid or already used, please request a new one.",
                ServerPassportVerifyTooFrequent: "Too many requests, please try again in 1 minute.",
                ServerPassportPasswordTooShort: "Password must be at least 8 characters.",
                ServerPassportResetPasswordTheSamePassword: "The new password must differ from the current one.",
                ServerPassportServiceEmailHasNotRegistered: "This account no longer exists.",
            },
        },
    };

    const S = document.getElementById.bind(document);
    const text = (id, value) => { S(id).textContent = value; };
    const show = (id, visible) => { S(id).hidden = !visible; };
    const T = I18N[navigator.language.toLowerCase().startsWith("zh") ? "zh" : "en"];

    const token = new URLSearchParams(location.search).get("token") ?? "";
    // 令牌留在地址栏会被历史记录和截图留存，读到就清掉
    history.replaceState(null, "", location.pathname);

    let timer = null;

    function fail(message) {
        show("loading", false);
        text("error", message);
        show("error", true);
    }

    function localize(json, fallback) {
        return T.messages[json?.l10nKey] ?? json?.message ?? fallback;
    }

    async function encrypt(value) {
        const der = Uint8Array.from(atob(PUBLIC_KEY_SPKI), ch => ch.charCodeAt(0));
        const key = await crypto.subtle.importKey("spki", der, { name: "RSA-OAEP", hash: "SHA-1" }, false, ["encrypt"]);
        const bytes = new Uint8Array(await crypto.subtle.encrypt({ name: "RSA-OAEP" }, key, new TextEncoder().encode(value)));
        let binary = "";
        for (const byte of bytes) {
            binary += String.fromCharCode(byte);
        }

        return btoa(binary);
    }

    function countdown(seconds) {
        const expire = S("expire");
        const deadline = Date.now() + (seconds * 1000);

        const render = () => {
            const left = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
            const minutes = Math.floor(left / 60);
            expire.textContent = `${T.expire} ${minutes}:${String(left % 60).padStart(2, "0")}`;

            if (left === 0) {
                clearInterval(timer);
                S("password").disabled = true;
                S("confirm").disabled = true;
                S("submit").disabled = true;
                fail(T.expired);
            }
        };

        render();
        timer = setInterval(render, 1000);
    }

    async function prepare() {
        text("loading", T.loading);
        show("loading", true);

        if (!token) {
            fail(T.noToken);
            return;
        }

        let json;
        try {
            const response = await fetch(`${API}/${encodeURIComponent(token)}`);
            json = await response.json();
        } catch {
            fail(T.network);
            return;
        }

        if (json.retcode !== 0) {
            fail(localize(json, T.invalid));
            return;
        }

        clearInterval(timer);
        show("loading", false);
        text("account", `${T.account}: ${json.data.UserName}`);
        show("form", true);
        countdown(json.data.ExpireInSeconds);
    }

    S("form").addEventListener("submit", async event => {
        event.preventDefault();

        const password = S("password").value;
        const confirm = S("confirm").value;
        show("error", false);

        if (password.length < 8) {
            fail(T.tooShort);
            return;
        }

        if (password !== confirm) {
            fail(T.mismatch);
            return;
        }

        const submit = S("submit");
        submit.disabled = true;
        submit.textContent = T.submitting;

        try {
            const response = await fetch(API, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ Token: await encrypt(token), Password: await encrypt(password) }),
            });

            const json = await response.json();
            if (json.retcode === 0) {
                clearInterval(timer);
                show("form", false);
                text("done-text", T.done);
                show("done", true);
                return;
            }

            fail(localize(json, T.invalid));
        } catch {
            fail(T.network);
        } finally {
            submit.disabled = false;
            submit.textContent = T.submit;
        }
    });

    text("title", T.title);
    text("lead", T.lead);
    text("footer", T.footer);
    text("label-password", T.password);
    text("label-confirm", T.confirm);
    text("submit", T.submit);
    document.title = `${T.title} · Snap Hutao Rev`;
    document.documentElement.lang = T === I18N.zh ? "zh-CN" : "en";
    prepare();
</script>
</body>
</html>
